  <g fill="#2A3A30">
    <path d="M60 820 L110 734 L160 820 Z"/>
    <path d="M120 822 L130 766 L140 822 Z"/>
    <path d="M1460 826 L1520 740 L1580 826 Z"/>
    <path d="M1540 830 L1550 774 L1560 830 Z"/>
  </g>
</svg>
